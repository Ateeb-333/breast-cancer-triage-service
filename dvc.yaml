stages:
  train:
    cmd: python -m training.train --data-path data/raw/breast_cancer.csv --output-dir artifacts --model-version 1.0.0 --metrics-path metrics.json
    deps:
      - data/raw/breast_cancer.csv
      - training/train.py
      - requirements-train.txt
    params:
      - seed
      - test_size
      - models
    outs:
      - artifacts/model.joblib
      - artifacts/model_card.json
    metrics:
      - metrics.json:
          cache: false
